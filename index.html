<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>2048 經典單人版 - 極致順暢遊戲體驗</title>
    <meta name="description" content="精美的 2048 單人經典網頁版遊戲，支援多種棋盤尺寸 (3x3 ~ 6x6)、深淺色主題切換、流暢動畫與合成音效！">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        boardBg: '#bbada0',
                        tileBg: '#ccc0b3',
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts & FontAwesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        html, body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #faf8ef;
            color: #776e65;
            overflow-x: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* 黑暗主題 Dark Mode */
        body.dark-theme {
            background-color: #0b0f19;
            color: #f8fafc;
        }
        body.dark-theme .theme-card {
            background-color: #1e293b !important;
            border-color: #334155 !important;
            color: #f8fafc !important;
        }
        body.dark-theme .theme-subtext {
            color: #94a3b8 !important;
        }
        body.dark-theme .board-bg-container {
            background-color: #1e293b !important;
            border-color: #334155 !important;
        }
        body.dark-theme .tile-empty-cell {
            background-color: #0f172a !important;
        }

        /* 遊戲畫板容器 */
        .board-container {
            position: relative;
            touch-action: none;
            box-sizing: border-box;
        }

        /* 方塊與動畫外框 */
        .tile-wrapper {
            position: absolute;
            transition: top 120ms ease-in-out, left 120ms ease-in-out;
            padding: 6px;
            box-sizing: border-box;
            will-change: top, left;
            z-index: 10;
        }

        .tile-inner {
            width: 100%;
            height: 100%;
            border-radius: 0.9rem;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 400;
            font-family: 'Fredoka One', sans-serif;
            box-shadow: 0 6px 14px -2px rgba(0, 0, 0, 0.16), inset 0 2px 0 rgba(255, 255, 255, 0.25);
            transition: background-color 150ms ease, color 150ms ease;
            letter-spacing: 0.01em;
        }

        /* 方塊出現與合成 Keyframe 動畫 */
        @keyframes tileAppear {
            0% {
                opacity: 0;
                transform: scale(0);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes tilePop {
            0% { transform: scale(1); }
            50% { transform: scale(1.22); }
            100% { transform: scale(1); }
        }

        .tile-new .tile-inner {
            animation: tileAppear 200ms cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .tile-merged .tile-inner {
            z-index: 25;
            animation: tilePop 200ms ease-in-out forwards;
        }

        /* 經典與進階方塊顏色設定 */
        .tile-2 { background-color: #eee4da; color: #776e65; font-size: 2.35rem; }
        .tile-4 { background-color: #ede0c8; color: #776e65; font-size: 2.35rem; }
        .tile-8 { background-color: #f2b179; color: #f9f6f2; font-size: 2.35rem; }
        .tile-16 { background-color: #f59563; color: #f9f6f2; font-size: 2.1rem; }
        .tile-32 { background-color: #f67c5f; color: #f9f6f2; font-size: 2.1rem; }
        .tile-64 { background-color: #f65e3b; color: #f9f6f2; font-size: 2.1rem; }
        .tile-128 { background-color: #edcf72; color: #f9f6f2; font-size: 1.85rem; box-shadow: 0 0 12px 2px rgba(237, 207, 114, 0.4); }
        .tile-256 { background-color: #edcc61; color: #f9f6f2; font-size: 1.85rem; box-shadow: 0 0 15px 3px rgba(237, 204, 97, 0.5); }
        .tile-512 { background-color: #edc850; color: #f9f6f2; font-size: 1.85rem; box-shadow: 0 0 18px 4px rgba(237, 200, 80, 0.6); }
        .tile-1024 { background-color: #edc53f; color: #f9f6f2; font-size: 1.5rem; box-shadow: 0 0 22px 5px rgba(237, 197, 63, 0.7); }
        .tile-2048 { background-color: #edc22e; color: #f9f6f2; font-size: 1.5rem; box-shadow: 0 0 30px 8px rgba(237, 194, 46, 0.85); }
        .tile-4096 { background-color: #a040fb; color: #f9f6f2; font-size: 1.5rem; box-shadow: 0 0 30px 8px rgba(160, 64, 251, 0.85); }
        .tile-8192 { background-color: #f5222d; color: #f9f6f2; font-size: 1.5rem; box-shadow: 0 0 30px 8px rgba(245, 34, 45, 0.85); }
        .tile-16384 { background-color: #13c2c2; color: #f9f6f2; font-size: 1.2rem; box-shadow: 0 0 30px 8px rgba(19, 194, 194, 0.85); }
        .tile-super { background-color: #3c3a32; color: #f9f6f2; font-size: 1.2rem; box-shadow: 0 0 20px rgba(0,0,0,0.5); }

        /* 手機 RWD 文字調適 */
        @media (max-width: 640px) {
            .tile-wrapper { padding: 4px; }
            .tile-2, .tile-4, .tile-8 { font-size: 1.85rem; }
            .tile-16, .tile-32, .tile-64 { font-size: 1.6rem; }
            .tile-128, .tile-256, .tile-512 { font-size: 1.35rem; }
            .tile-1024, .tile-2048, .tile-4096, .tile-8192 { font-size: 1.2rem; }
            .tile-16384, .tile-super { font-size: 1rem; }
        }

        .btn-action {
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            touch-action: manipulation;
        }
        .btn-action:hover {
            transform: translateY(-1.5px);
        }
        .btn-action:active {
            transform: scale(0.94);
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translate(-50%, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -42px) scale(1.3);
            }
        }

        .score-float {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.25rem;
            font-weight: 900;
            color: #d97706;
            text-shadow: 0 2px 4px rgba(0,0,0,0.15);
            animation: floatUp 600ms cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
            pointer-events: none;
            z-index: 50;
            white-space: nowrap;
        }

        @keyframes bumpScale {
            0% { transform: scale(1); }
            50% { transform: scale(1.18); }
            100% { transform: scale(1); }
        }

        .bump-animation {
            animation: bumpScale 200ms ease-in-out;
        }

        .backdrop-blur-custom {
            backdrop-filter: blur(8px);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between py-6 px-4">

    <!-- 主遊戲內容 View (純淨簡潔單人版 Centered Layout) -->
    <main class="w-full max-w-lg mx-auto flex-1 flex flex-col justify-between gap-5">

        <!-- 頂部 Header & 控制工具列 -->
        <header class="space-y-4">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-4xl sm:text-5xl tracking-wide text-amber-900 dark:text-amber-400" style="font-family:'Fredoka One',sans-serif;">
                        2048
                    </h1>
                </div>

                <!-- 分數板數值區域 -->
                <div class="flex gap-2">
                    <div id="score-container" class="relative theme-card bg-amber-100 border border-amber-300 text-amber-950 px-3.5 py-2 rounded-2xl text-center min-w-[76px] shadow-sm">
                        <span class="block text-[10px] font-black uppercase text-amber-700 theme-subtext">SCORE</span>
                        <span id="score" class="text-xl sm:text-2xl" style="font-family:'Fredoka One',sans-serif;">0</span>
                    </div>

                    <div class="theme-card bg-amber-200/80 border border-amber-400 text-amber-950 px-3.5 py-2 rounded-2xl text-center min-w-[76px] shadow-sm">
                        <span class="block text-[10px] font-black uppercase text-amber-800 theme-subtext">BEST</span>
                        <span id="best-score" class="text-xl sm:text-2xl" style="font-family:'Fredoka One',sans-serif;">0</span>
                    </div>
                </div>
            </div>

            <!-- 控制快捷按鈕區 -->
            <div class="flex items-center justify-between gap-2 pt-1">
                <div class="flex items-center gap-2">
                    <button id="undo-btn" class="btn-action bg-amber-200/80 hover:bg-amber-300 disabled:opacity-40 disabled:cursor-not-allowed text-amber-950 text-base p-2.5 rounded-2xl border border-amber-300 shadow-sm" title="Undo">
                        <i class="fas fa-undo-alt"></i>
                    </button>
                    <button id="restart-btn" class="btn-action bg-amber-500 hover:bg-amber-600 text-white text-base p-2.5 rounded-2xl shadow-md" title="New Game">
                        <i class="fas fa-redo-alt"></i>
                    </button>
                </div>

                <div class="flex items-center gap-2">
                    <!-- 規格選擇選單 -->
                    <select id="grid-size-select" class="theme-card bg-white dark:bg-slate-800 border border-amber-300 dark:border-slate-700 text-amber-950 dark:text-white font-extrabold text-xs sm:text-sm rounded-2xl px-3 py-2.5 focus:outline-none cursor-pointer shadow-sm">
                        <option value="3">3 × 3</option>
                        <option value="4" selected>4 × 4</option>
                        <option value="5">5 × 5</option>
                        <option value="6">6 × 6</option>
                    </select>

                    <button id="sound-btn" class="btn-action theme-card bg-white dark:bg-slate-800 border border-amber-300 dark:border-slate-700 text-amber-950 dark:text-white font-black text-sm p-2.5 rounded-2xl shadow-sm" title="音效切換">
                        <span id="sound-icon"><i class="fas fa-volume-up"></i></span>
                    </button>

                    <button id="theme-btn" class="btn-action theme-card bg-white dark:bg-slate-800 border border-amber-300 dark:border-slate-700 text-amber-950 dark:text-white font-black text-sm p-2.5 rounded-2xl shadow-sm" title="主題風格切換">
                        <span id="theme-icon"><i class="fas fa-moon"></i></span>
                    </button>

                </div>
            </div>
        </header>

        <!-- 2048 核心遊戲戰場 (Board Container) -->
        <div class="w-full aspect-square relative">
            <div id="board-container" class="board-container board-bg-container bg-boardBg rounded-3xl w-full h-full p-2.5 sm:p-3 shadow-2xl overflow-hidden border-4 border-amber-800/20">
                <!-- 背景格子 (Grid Background Cells) -->
                <div id="grid-bg" class="grid grid-cols-4 gap-2.5 sm:gap-3 w-full h-full"></div>
                <!-- 動態方塊層 (Dynamic Tile Container) -->
                <div id="tile-container" class="absolute inset-0 p-2.5 sm:p-3 pointer-events-none"></div>
            </div>

            <!-- 遊戲結束 / 達成 2048 勝負 Overlay -->
            <div id="game-overlay" class="absolute inset-0 bg-amber-950/80 backdrop-blur-custom rounded-3xl flex flex-col items-center justify-center p-6 text-center text-white opacity-0 pointer-events-none transition-all duration-300 z-40 space-y-4">
                <div id="overlay-icon" class="text-6xl animate-bounce">🏆</div>
                <h2 id="overlay-title" class="text-4xl sm:text-5xl" style="font-family:'Fredoka One',sans-serif; color:#fde047;">2048!</h2>
                <p id="overlay-msg" class="text-3xl">🎉</p>
                
                <div class="flex items-center gap-3 pt-2">
                    <button id="keep-going-btn" class="btn-action bg-emerald-500 hover:bg-emerald-600 text-white text-2xl p-4 rounded-2xl shadow-lg" title="Keep going">
                        🚀
                    </button>
                    <button id="overlay-restart-btn" class="btn-action bg-amber-500 hover:bg-amber-600 text-white text-2xl p-4 rounded-2xl shadow-lg" title="New game">
                        🔄
                    </button>
                </div>
            </div>
        </div>

        <!-- 虛擬方向鍵 (僅在行動端或小螢幕提供額外點擊) -->
        <div class="grid grid-cols-3 gap-2 max-w-[240px] mx-auto sm:hidden pt-1">
            <div></div>
            <button id="btn-up" class="btn-action theme-card bg-white border border-amber-300 text-amber-900 font-black text-lg py-2.5 rounded-2xl shadow-sm flex items-center justify-center">
                <i class="fas fa-chevron-up"></i>
            </button>
            <div></div>
            <button id="btn-left" class="btn-action theme-card bg-white border border-amber-300 text-amber-900 font-black text-lg py-2.5 rounded-2xl shadow-sm flex items-center justify-center">
                <i class="fas fa-chevron-left"></i>
            </button>
            <button id="btn-down" class="btn-action theme-card bg-white border border-amber-300 text-amber-900 font-black text-lg py-2.5 rounded-2xl shadow-sm flex items-center justify-center">
                <i class="fas fa-chevron-down"></i>
            </button>
            <button id="btn-right" class="btn-action theme-card bg-white border border-amber-300 text-amber-900 font-black text-lg py-2.5 rounded-2xl shadow-sm flex items-center justify-center">
                <i class="fas fa-chevron-right"></i>
            </button>
        </div>

        <footer class="text-center text-xs font-bold theme-subtext text-amber-800/60 pb-2 flex items-center justify-center gap-3">
            <span title="Arrow keys"><i class="fas fa-keyboard"></i> ↑ ↓ ← →</span>
            <span class="opacity-40">·</span>
            <span title="WASD">W A S D</span>
            <span class="opacity-40">·</span>
            <span title="Swipe"><i class="fas fa-hand-point-up"></i> swipe</span>
        </footer>
    </main>


    <!-- JavaScript 核心邏輯 -->
    <script>
        // 音效合成引擎 (Web Audio API)
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.enabled = localStorage.getItem('2048_sound_enabled') !== '0';
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playMove() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(140, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(80, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            }

            playMerge(mergedValue) {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                const baseFreq = 220 + Math.log2(mergedValue || 2) * 50;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(baseFreq, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.5, this.ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.22, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            }

            playUndo() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(320, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(160, this.ctx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.12);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.12);
            }

            playVictory() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime + i * 0.1);
                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime + i * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + i * 0.1 + 0.3);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(this.ctx.currentTime + i * 0.1);
                    osc.stop(this.ctx.currentTime + i * 0.1 + 0.3);
                });
            }

            playGameOver() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(260, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(70, this.ctx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.4);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.4);
            }
        }

        let tileUniqueId = 1;
        class Tile {
            constructor(r, c, value) {
                this.r = r;
                this.c = c;
                this.value = value || 2;
                this.id = tileUniqueId++;
                this.previousPosition = null;
                this.mergedFrom = null;
                this.isNew = true;
            }

            savePosition() {
                this.previousPosition = { r: this.r, c: this.c };
            }

            updatePosition(r, c) {
                this.r = r;
                this.c = c;
            }
        }

        class Game2048 {
            constructor() {
                this.size = parseInt(localStorage.getItem('2048_single_size') || '4', 10);
                this.grid = [];
                this.tiles = [];
                this.score = 0;
                this.moveCount = 0;
                this.history = [];
                this.won = false;
                this.keepPlaying = false;
                this.over = false;
                this.sound = new SoundEngine();
                this.isDarkMode = localStorage.getItem('2048_theme_dark') === '1';

                // DOM 元素引用
                this.gridBg = document.getElementById('grid-bg');
                this.tileContainer = document.getElementById('tile-container');
                this.boardContainer = document.getElementById('board-container');
                this.scoreEl = document.getElementById('score');
                this.scoreContainer = document.getElementById('score-container');
                this.bestScoreEl = document.getElementById('best-score');
                this.overlay = document.getElementById('game-overlay');
                this.undoBtn = document.getElementById('undo-btn');

                this.initUI();
                this.setupInputs();
                this.restart();
            }

            initUI() {
                if (this.isDarkMode) {
                    document.body.classList.add('dark-theme');
                    document.documentElement.classList.add('dark');
                }
                this.updateThemeUI();
                this.updateSoundUI();

                const select = document.getElementById('grid-size-select');
                if (select) select.value = this.size.toString();
            }

            updateSoundUI() {
                const icon = document.getElementById('sound-icon');
                const text = document.getElementById('modal-sound-text');
                if (icon) icon.innerHTML = this.sound.enabled ? '<i class="fas fa-volume-up"></i>' : '<i class="fas fa-volume-mute text-gray-400"></i>';
                if (text) text.textContent = this.sound.enabled ? '🔊' : '🔇';
            }

            updateThemeUI() {
                const icon = document.getElementById('theme-icon');
                const text = document.getElementById('modal-theme-text');
                if (icon) icon.innerHTML = this.isDarkMode ? '<i class="fas fa-sun text-yellow-400"></i>' : '<i class="fas fa-moon"></i>';
                if (text) text.textContent = this.isDarkMode ? '🌙' : '☀️';
            }

            getBestScoreForSize(size) {
                return parseInt(localStorage.getItem(`2048_single_best_${size}`) || '0', 10);
            }

            setBestScoreForSize(size, score) {
                localStorage.setItem(`2048_single_best_${size}`, score.toString());
            }

            saveCurrentGame() {
                const gridValues = Array(this.size).fill(null).map(() => Array(this.size).fill(0));
                for (let r = 0; r < this.size; r++) {
                    for (let c = 0; c < this.size; c++) {
                        if (this.grid[r][c]) gridValues[r][c] = this.grid[r][c].value;
                    }
                }
                localStorage.setItem(`2048_single_saved_grid_${this.size}`, JSON.stringify(gridValues));
                localStorage.setItem(`2048_single_saved_score_${this.size}`, this.score.toString());
                localStorage.setItem(`2048_single_saved_won_${this.size}`, this.won ? '1' : '0');
                localStorage.setItem('2048_single_size', this.size.toString());
            }

            loadSavedGame() {
                try {
                    const savedGrid = JSON.parse(localStorage.getItem(`2048_single_saved_grid_${this.size}`) || 'null');
                    const savedScore = parseInt(localStorage.getItem(`2048_single_saved_score_${this.size}`) || '0', 10);
                    const savedWon = localStorage.getItem(`2048_single_saved_won_${this.size}`) === '1';

                    if (!savedGrid || savedGrid.length !== this.size) return false;

                    let hasTile = false;
                    this.grid = Array(this.size).fill(null).map(() => Array(this.size).fill(null));
                    this.tiles = [];
                    if (this.tileContainer) this.tileContainer.innerHTML = '';

                    for (let r = 0; r < this.size; r++) {
                        for (let c = 0; c < this.size; c++) {
                            const val = savedGrid[r][c];
                            if (val > 0) {
                                hasTile = true;
                                const tile = new Tile(r, c, val);
                                tile.isNew = false;
                                this.grid[r][c] = tile;
                                this.tiles.push(tile);
                            }
                        }
                    }

                    if (!hasTile) return false;

                    this.score = savedScore;
                    this.won = savedWon;
                    this.keepPlaying = false;
                    this.over = !this.canMove();

                    this.buildBackgroundGrid();
                    this.updateScore(0, true);
                    this.actuate();
                    return true;
                } catch(e) {
                    return false;
                }
            }

            buildBackgroundGrid() {
                this.gridBg.innerHTML = '';
                this.gridBg.style.gridTemplateColumns = `repeat(${this.size}, minmax(0, 1fr))`;
                this.gridBg.style.gridTemplateRows = `repeat(${this.size}, minmax(0, 1fr))`;
                for (let i = 0; i < this.size * this.size; i++) {
                    const cell = document.createElement('div');
                    cell.className = 'tile-empty-cell bg-tileBg/60 rounded-xl w-full h-full';
                    this.gridBg.appendChild(cell);
                }
            }

            restart(forceNew = false) {
                const select = document.getElementById('grid-size-select');
                if (select) this.size = parseInt(select.value, 10);

                this.grid = Array(this.size).fill(null).map(() => Array(this.size).fill(null));
                this.tiles = [];
                if (this.tileContainer) this.tileContainer.innerHTML = '';
                this.score = 0;
                this.moveCount = 0;
                this.history = [];
                this.won = false;
                this.keepPlaying = false;
                this.over = false;

                const bestScore = this.getBestScoreForSize(this.size);
                if (this.bestScoreEl) this.bestScoreEl.textContent = bestScore;

                this.buildBackgroundGrid();
                this.hideOverlay();
                this.updateScore(0, true);
                this.updateUndoButton();

                if (!forceNew) {
                    const restored = this.loadSavedGame();
                    if (restored) {
                        this.updateUndoButton();
                        return;
                    }
                }

                localStorage.removeItem(`2048_single_saved_grid_${this.size}`);
                localStorage.removeItem(`2048_single_saved_score_${this.size}`);
                localStorage.removeItem(`2048_single_saved_won_${this.size}`);

                this.addRandomTile();
                this.addRandomTile();
                this.actuate();
                this.saveCurrentGame();
            }

            addRandomTile() {
                const emptyCells = [];
                for (let r = 0; r < this.size; r++) {
                    for (let c = 0; c < this.size; c++) {
                        if (!this.grid[r][c]) emptyCells.push({ r, c });
                    }
                }
                if (emptyCells.length > 0) {
                    const randIndex = Math.floor(Math.random() * emptyCells.length);
                    const choice = emptyCells[randIndex];
                    const val = Math.random() < 0.9 ? 2 : 4;
                    const tile = new Tile(choice.r, choice.c, val);
                    this.grid[choice.r][choice.c] = tile;
                    this.tiles.push(tile);
                    return tile;
                }
                return null;
            }

            saveState() {
                const gridCopy = Array(this.size).fill(null).map(() => Array(this.size).fill(0));
                for (let r = 0; r < this.size; r++) {
                    for (let c = 0; c < this.size; c++) {
                        if (this.grid[r][c]) gridCopy[r][c] = this.grid[r][c].value;
                    }
                }
                this.history.push({ gridValues: gridCopy, score: this.score, won: this.won, over: this.over });
                if (this.history.length > 15) this.history.shift();
                this.updateUndoButton();
            }

            undo() {
                if (this.history.length === 0 || this.over) return;
                const lastState = this.history.pop();
                this.score = lastState.score;
                this.won = lastState.won;
                this.over = lastState.over;
                this.grid = Array(this.size).fill(null).map(() => Array(this.size).fill(null));
                this.tiles = [];
                if (this.tileContainer) this.tileContainer.innerHTML = '';
                for (let r = 0; r < this.size; r++) {
                    for (let c = 0; c < this.size; c++) {
                        const val = lastState.gridValues[r][c];
                        if (val > 0) {
                            const tile = new Tile(r, c, val);
                            tile.isNew = false;
                            this.grid[r][c] = tile;
                            this.tiles.push(tile);
                        }
                    }
                }
                this.sound.playUndo();
                this.hideOverlay();
                this.updateScore(0, true);
                this.actuate();
                this.updateUndoButton();
                this.saveCurrentGame();
            }

            updateUndoButton() {
                if (this.undoBtn) {
                    this.undoBtn.disabled = this.history.length === 0;
                }
            }

            prepareTiles() {
                this.tiles.forEach(tile => {
                    tile.savePosition();
                    tile.mergedFrom = null;
                    tile.isNew = false;
                });
            }

            move(direction) {
                if (this.over) return false;
                const vectors = [{ r: -1, c: 0 }, { r: 0, c: 1 }, { r: 1, c: 0 }, { r: 0, c: -1 }];
                const vector = vectors[direction];
                const traversals = this.buildTraversals(vector);
                let moved = false;
                let mergedTotalScore = 0;
                let mergedAny = false;

                this.prepareTiles();

                traversals.r.forEach(r => {
                    traversals.c.forEach(c => {
                        const tile = this.grid[r][c];
                        if (tile) {
                            const positions = this.findFarthestPosition({ r, c }, vector);
                            const nextTile = (this.withinBounds(positions.next) && this.grid[positions.next.r]) ? this.grid[positions.next.r][positions.next.c] : null;

                            if (nextTile && nextTile.value === tile.value && !nextTile.mergedFrom) {
                                const mergedValue = tile.value * 2;
                                const mergedTile = new Tile(positions.next.r, positions.next.c, mergedValue);
                                mergedTile.mergedFrom = [tile, nextTile];
                                mergedTile.isNew = false;

                                this.grid[r][c] = null;
                                this.grid[positions.next.r][positions.next.c] = mergedTile;

                                this.tiles = this.tiles.filter(t => t !== tile && t !== nextTile);
                                this.tiles.push(mergedTile);

                                tile.updatePosition(positions.next.r, positions.next.c);
                                mergedTotalScore += mergedValue;
                                mergedAny = true;
                                moved = true;
                            } else {
                                if (r !== positions.farthest.r || c !== positions.farthest.c) {
                                    this.grid[r][c] = null;
                                    this.grid[positions.farthest.r][positions.farthest.c] = tile;
                                    tile.updatePosition(positions.farthest.r, positions.farthest.c);
                                    moved = true;
                                }
                            }
                        }
                    });
                });

                if (moved) {
                    this.moveCount++;
                    this.saveState();
                    if (mergedAny) {
                        this.sound.playMerge(mergedTotalScore);
                        this.showScoreFloat(mergedTotalScore);
                    } else {
                        this.sound.playMove();
                    }

                    this.updateScore(mergedTotalScore);
                    this.addRandomTile();
                    this.actuate();
                    this.saveCurrentGame();

                    if (!this.won && !this.keepPlaying && this.hasTileValue(2048)) {
                        this.won = true;
                        this.sound.playVictory();
                        this.showOverlay(true);
                    } else if (!this.canMove()) {
                        this.over = true;
                        this.sound.playGameOver();
                        this.showOverlay(false);
                    }
                }
                return moved;
            }

            hasTileValue(targetVal) {
                for (let r = 0; r < this.size; r++) {
                    for (let c = 0; c < this.size; c++) {
                        if (this.grid[r][c] && this.grid[r][c].value === targetVal) return true;
                    }
                }
                return false;
            }

            buildTraversals(vector) {
                const traversals = { r: [], c: [] };
                for (let pos = 0; pos < this.size; pos++) {
                    traversals.r.push(pos);
                    traversals.c.push(pos);
                }
                if (vector.r === 1) traversals.r.reverse();
                if (vector.c === 1) traversals.c.reverse();
                return traversals;
            }

            findFarthestPosition(cell, vector) {
                let previous;
                let current = { r: cell.r, c: cell.c };
                do {
                    previous = current;
                    current = { r: previous.r + vector.r, c: previous.c + vector.c };
                } while (this.withinBounds(current) && !this.grid[current.r][current.c]);
                return { farthest: previous, next: current };
            }

            withinBounds(position) {
                return position.r >= 0 && position.r < this.size && position.c >= 0 && position.c < this.size;
            }

            canMove() {
                for (let r = 0; r < this.size; r++) {
                    for (let c = 0; c < this.size; c++) {
                        if (!this.grid[r][c]) return true;
                        const val = this.grid[r][c].value;
                        if (r < this.size - 1 && this.grid[r + 1][c] && this.grid[r + 1][c].value === val) return true;
                        if (c < this.size - 1 && this.grid[r][c + 1] && this.grid[r][c + 1].value === val) return true;
                    }
                }
                return false;
            }

            actuate() {
                window.requestAnimationFrame(() => {
                    const step = 100 / this.size;
                    const activeIds = new Set();

                    this.tiles.forEach(tile => {
                        activeIds.add(tile.id);
                        let tileWrapper = document.getElementById(`tile-wrap-${tile.id}`);

                        if (!tileWrapper) {
                            tileWrapper = document.createElement('div');
                            tileWrapper.id = `tile-wrap-${tile.id}`;
                            tileWrapper.innerHTML = `<div class="tile-inner"></div>`;
                            this.tileContainer.appendChild(tileWrapper);
                        }

                        const innerEl = tileWrapper.querySelector('.tile-inner');
                        let wrapperClass = 'tile-wrapper';
                        if (tile.isNew) wrapperClass += ' tile-new';
                        if (tile.mergedFrom) wrapperClass += ' tile-merged';

                        tileWrapper.className = wrapperClass;
                        tileWrapper.style.top = `${tile.r * step}%`;
                        tileWrapper.style.left = `${tile.c * step}%`;
                        tileWrapper.style.width = `${step}%`;
                        tileWrapper.style.height = `${step}%`;

                        let colorClass = `tile-${tile.value}`;
                        if (tile.value > 16384) colorClass = 'tile-super';
                        innerEl.className = `tile-inner ${colorClass}`;
                        innerEl.textContent = tile.value;
                    });

                    const allWrappers = Array.from(this.tileContainer.querySelectorAll('.tile-wrapper'));
                    allWrappers.forEach(el => {
                        const idStr = el.id.replace('tile-wrap-', '');
                        if (idStr && !activeIds.has(parseInt(idStr, 10))) {
                            setTimeout(() => { if (el && el.parentNode) el.parentNode.removeChild(el); }, 100);
                        }
                    });
                });
            }

            updateScore(delta, isReset = false) {
                if (isReset) this.score = delta;
                else this.score += delta;
                if (this.scoreEl) this.scoreEl.textContent = this.score;

                if (delta > 0 && this.scoreContainer) {
                    this.scoreContainer.classList.remove('bump-animation');
                    void this.scoreContainer.offsetWidth;
                    this.scoreContainer.classList.add('bump-animation');
                }

                const currentBest = this.getBestScoreForSize(this.size);
                if (this.score > currentBest) {
                    this.setBestScoreForSize(this.size, this.score);
                    if (this.bestScoreEl) this.bestScoreEl.textContent = this.score;
                }
            }

            showScoreFloat(addedScore) {
                if (addedScore <= 0 || !this.scoreContainer) return;
                const floatEl = document.createElement('div');
                floatEl.className = 'score-float';
                floatEl.textContent = `+${addedScore}`;
                floatEl.style.left = '50%'; floatEl.style.top = '-10px';
                this.scoreContainer.appendChild(floatEl);
                setTimeout(() => { if (floatEl && floatEl.parentNode) floatEl.parentNode.removeChild(floatEl); }, 600);
            }

            showOverlay(isWin) {
                const title = document.getElementById('overlay-title');
                const msg = document.getElementById('overlay-msg');
                const icon = document.getElementById('overlay-icon');
                const keepBtn = document.getElementById('keep-going-btn');

                if (isWin) {
                    if (title) title.textContent = '🎉';
                    if (msg) msg.textContent = '🏆';
                    if (icon) icon.textContent = '🎊';
                    if (keepBtn) keepBtn.classList.remove('hidden');
                } else {
                    if (title) title.textContent = '💀';
                    if (msg) msg.textContent = '💔';
                    if (icon) icon.textContent = '🚫';
                    if (keepBtn) keepBtn.classList.add('hidden');
                }

                if (this.overlay) {
                    this.overlay.classList.remove('opacity-0', 'pointer-events-none');
                    this.overlay.classList.add('opacity-100');
                }
            }

            hideOverlay() {
                if (this.overlay) {
                    this.overlay.classList.remove('opacity-100');
                    this.overlay.classList.add('opacity-0', 'pointer-events-none');
                }
            }

            setupInputs() {
                // 鍵盤操控
                document.addEventListener('keydown', (e) => {
                    const activeTag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
                    if (['input', 'textarea', 'select'].includes(activeTag)) return;

                    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
                    switch (e.key) {
                        case 'ArrowUp': case 'w': case 'W': this.move(0); break;
                        case 'ArrowRight': case 'd': case 'D': this.move(1); break;
                        case 'ArrowDown': case 's': case 'S': this.move(2); break;
                        case 'ArrowLeft': case 'a': case 'A': this.move(3); break;
                    }
                });

                // 手機 Touch 觸控滑動
                let touchStartX = 0, touchStartY = 0;
                if (this.boardContainer) {
                    this.boardContainer.addEventListener('touchstart', (e) => {
                        if (e.touches.length > 0) {
                            touchStartX = e.touches[0].clientX;
                            touchStartY = e.touches[0].clientY;
                        }
                    }, { passive: true });

                    this.boardContainer.addEventListener('touchend', (e) => {
                        if (touchStartX && touchStartY && e.changedTouches.length > 0) {
                            const dx = e.changedTouches[0].clientX - touchStartX;
                            const dy = e.changedTouches[0].clientY - touchStartY;
                            if (Math.max(Math.abs(dx), Math.abs(dy)) > 25) {
                                if (Math.abs(dx) > Math.abs(dy)) {
                                    if (dx > 0) this.move(1); else this.move(3);
                                } else {
                                    if (dy > 0) this.move(2); else this.move(0);
                                }
                            }
                            touchStartX = 0; touchStartY = 0;
                        }
                    }, { passive: true });
                }

                // 按鈕事件綁定
                const restartBtn = document.getElementById('restart-btn');
                if (restartBtn) restartBtn.addEventListener('click', () => this.restart(true));

                const overlayRestartBtn = document.getElementById('overlay-restart-btn');
                if (overlayRestartBtn) overlayRestartBtn.addEventListener('click', () => this.restart(true));

                if (this.undoBtn) this.undoBtn.addEventListener('click', () => this.undo());

                const sizeSelect = document.getElementById('grid-size-select');
                if (sizeSelect) sizeSelect.addEventListener('change', () => this.restart());

                const soundBtn = document.getElementById('sound-btn');
                if (soundBtn) {
                    soundBtn.addEventListener('click', () => {
                        this.sound.enabled = !this.sound.enabled;
                        localStorage.setItem('2048_sound_enabled', this.sound.enabled ? '1' : '0');
                        this.updateSoundUI();
                    });
                }

                const themeBtn = document.getElementById('theme-btn');
                if (themeBtn) {
                    themeBtn.addEventListener('click', () => {
                        this.isDarkMode = !this.isDarkMode;
                        document.body.classList.toggle('dark-theme', this.isDarkMode);
                        document.documentElement.classList.toggle('dark', this.isDarkMode);
                        localStorage.setItem('2048_theme_dark', this.isDarkMode ? '1' : '0');
                        this.updateThemeUI();
                    });
                }

                const keepBtn = document.getElementById('keep-going-btn');
                if (keepBtn) keepBtn.addEventListener('click', () => { this.keepPlaying = true; this.hideOverlay(); });

                // 虛擬方向鍵點擊事件
                const btnUp = document.getElementById('btn-up'); if (btnUp) btnUp.addEventListener('click', () => this.move(0));
                const btnRight = document.getElementById('btn-right'); if (btnRight) btnRight.addEventListener('click', () => this.move(1));
                const btnDown = document.getElementById('btn-down'); if (btnDown) btnDown.addEventListener('click', () => this.move(2));
                const btnLeft = document.getElementById('btn-left'); if (btnLeft) btnLeft.addEventListener('click', () => this.move(3));

                // Modal 設定視窗控制
                const openSettingsBtn = document.getElementById('open-settings-btn');
                const settingsModal = document.getElementById('settings-modal');
                const closeSettingsBtn = document.getElementById('close-settings-modal-btn');
                const modalSoundBtn = document.getElementById('modal-sound-btn');
                const modalThemeBtn = document.getElementById('modal-theme-btn');
                const modalResetStatBtn = document.getElementById('modal-reset-stat-btn');

                if (openSettingsBtn && settingsModal) {
                    openSettingsBtn.addEventListener('click', () => {
                        settingsModal.classList.remove('opacity-0', 'pointer-events-none');
                        settingsModal.classList.add('opacity-100');
                    });
                }

                if (closeSettingsBtn && settingsModal) {
                    closeSettingsBtn.addEventListener('click', () => {
                        settingsModal.classList.remove('opacity-100');
                        settingsModal.classList.add('opacity-0', 'pointer-events-none');
                    });
                }

                if (settingsModal) {
                    settingsModal.addEventListener('click', (e) => {
                        if (e.target === settingsModal) {
                            settingsModal.classList.remove('opacity-100');
                            settingsModal.classList.add('opacity-0', 'pointer-events-none');
                        }
                    });
                }

                if (modalSoundBtn) {
                    modalSoundBtn.addEventListener('click', () => {
                        this.sound.enabled = !this.sound.enabled;
                        localStorage.setItem('2048_sound_enabled', this.sound.enabled ? '1' : '0');
                        this.updateSoundUI();
                    });
                }

                if (modalThemeBtn) {
                    modalThemeBtn.addEventListener('click', () => {
                        this.isDarkMode = !this.isDarkMode;
                        document.body.classList.toggle('dark-theme', this.isDarkMode);
                        document.documentElement.classList.toggle('dark', this.isDarkMode);
                        localStorage.setItem('2048_theme_dark', this.isDarkMode ? '1' : '0');
                        this.updateThemeUI();
                    });
                }

                if (modalResetStatBtn) {
                    modalResetStatBtn.addEventListener('click', () => {
                        if (confirm('Reset all best scores?')) {
                            [3, 4, 5, 6].forEach(sz => localStorage.removeItem(`2048_single_best_${sz}`));
                            if (this.bestScoreEl) this.bestScoreEl.textContent = '0';
                            alert('✅ Done!');
                        }
                    });
                }
            }
        }

        // 當頁面載入完成，初始化遊戲
        window.addEventListener('DOMContentLoaded', () => {
            window.game = new Game2048();
        });
    </script>
</body>
